# Example brood. Six roles, two harnesses, one explicit pipeline.

[brood]
name        = "six-pack"
description = "Full workflow: spec, implement, clean, architect, harden, QA."

# ---------------------------------------------------------------------------
# Roles. Order here is presentation only — the pipeline below decides flow,
# and `terminal` decides where work ends. Reordering this file changes nothing
# about behavior, which is the point.
# ---------------------------------------------------------------------------

[[role]]
name     = "specifier"
harness  = "claude"
model    = "opus"
worktree = "master"          # runs in the project root, not a linked worktree
receive  = "task"
gate     = "approval"        # handoffs from this role wait for a human decision

[[role]]
name     = "coder"
harness  = "claude"
model    = "opus"
worktree = "coder"
receive  = "task"

[[role]]
name     = "cleaner"
harness  = "pi"
model    = "openai-codex/gpt-5.6-sol"
args     = ["--no-extensions"]
worktree = "cleaner"
receive  = "batch"

  [role.batch]
  max_items = 8               # unbounded batches starve high-priority work
  max_age   = "5m"

[[role]]
name     = "architect"
harness  = "claude"
model    = "opus"
worktree = "architect"
receive  = "batch"

  [role.batch]
  max_items = 8
  max_age   = "5m"

[[role]]
name     = "hardener"
harness  = "pi"
model    = "openai-codex/gpt-5.6-sol"
args     = ["--no-extensions"]
worktree = "hardener"
receive  = "batch"

  [role.batch]
  max_items = 8
  max_age   = "5m"

[[role]]
name     = "qa"
harness  = "claude"
model    = "sonnet"
worktree = "qa"
receive  = "batch"

  [role.batch]
  max_items = 8
  max_age   = "5m"

# ---------------------------------------------------------------------------
# Pipeline. Explicit, so that adding a utility role or reordering the file
# cannot silently relocate the finish line.
# ---------------------------------------------------------------------------

[pipeline]
flow     = ["specifier", "coder", "cleaner", "architect", "hardener", "qa"]
terminal = "qa"

[leases]
default = "20m"              # unacked work returns to the queue; a stall is visible
