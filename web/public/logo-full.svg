<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="full-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="z-stroke-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="full-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="180" rx="24" fill="url(#full-bg)" />
  <rect width="716" height="176" x="2" y="2" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />

  <!-- Embedded Swarm Emblem (Left Icon) -->
  <g transform="translate(24, 18)">
    <rect width="144" height="144" rx="32" fill="#131b2e" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2" />

    <!-- Connection Beams -->
    <path d="M 40 44 L 104 44" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M 104 44 L 40 100" stroke="url(#z-stroke-full)" stroke-width="10" stroke-linecap="round" />
    <path d="M 40 100 L 104 100" stroke="#10b981" stroke-width="8" stroke-linecap="round" />

    <!-- Nodes -->
    <circle cx="40" cy="44" r="7" fill="#38bdf8" />
    <circle cx="104" cy="44" r="8" fill="#c084fc" />
    <circle cx="72" cy="72" r="9" fill="#ffffff" stroke="#a855f7" stroke-width="3" />
    <circle cx="40" cy="100" r="8" fill="#8b5cf6" />
    <circle cx="104" cy="100" r="7" fill="#34d399" />
  </g>

  <!-- Typography -->
  <g transform="translate(196, 0)">
    <!-- Logotype: ZERG -->
    <text x="0" y="106" font-family="'JetBrains Mono', 'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-2" fill="url(#text-grad)">zerg</text>

    <!-- Glowing Accent Dot on 'g' -->
    <circle cx="212" cy="98" r="7" fill="#a855f7" filter="url(#full-glow)" />

    <!-- Tagline: MULTI-AGENT ORCHESTRATOR -->
    <text x="4" y="138" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="4" fill="url(#sub-grad)">MULTI-AGENT ORCHESTRATOR</text>
  </g>
</svg>
