<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Glowing Orbs / Gradients -->
    <radialGradient id="purple-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emerald-glow" cx="90%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="z-stroke-og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Canvas -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Ambient Glowing Orbs -->
  <rect width="1200" height="630" fill="url(#purple-glow)" />
  <rect width="1200" height="630" fill="url(#cyan-glow)" />
  <rect width="1200" height="630" fill="url(#emerald-glow)" />

  <!-- Hexagonal Grid Overlay Background -->
  <g opacity="0.08" stroke="#8b5cf6" stroke-width="1.5" fill="none">
    <polygon points="1000,100 1080,146 1080,238 1000,284 920,238 920,146" />
    <polygon points="1000,340 1080,386 1080,478 1000,524 920,478 920,386" />
    <polygon points="1140,220 1220,266 1220,358 1140,404 1060,358 1060,266" />
    <polygon points="860,220 940,266 940,358 860,404 780,358 780,266" />

    <polygon points="100,400 180,446 180,538 100,584 20,538 20,446" />
  </g>

  <!-- Outer Card Frame -->
  <rect width="1160" height="590" x="20" y="20" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- LEFT COLUMN: Main Brand & Copy -->
  <g transform="translate(100, 120)">

    <!-- Top Badge -->
    <g transform="translate(0, 0)">
      <rect width="240" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="20" cy="18" r="4" fill="#34d399" />
      <text x="34" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#34d399">MULTI-AGENT ORCHESTRATOR</text>
    </g>

    <!-- Main Title "zerg" -->
    <text x="0" y="145" font-family="'JetBrains Mono', 'Inter', system-ui, sans-serif" font-size="110" font-weight="900" letter-spacing="-3" fill="url(#title-grad)">zerg</text>
    <circle cx="282" cy="132" r="10" fill="#a855f7" filter="url(#glow-card)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Supervise autonomous AI agent swarms in git worktrees.</text>
    <text x="0" y="230" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#64748b">Configured entirely in the UI. No config files or copied prompts.</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: Go Daemon -->
      <g transform="translate(0, 0)">
        <rect width="140" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8">⚡ Go Daemon</text>
      </g>

      <!-- Pill 2: Isolated Worktrees -->
      <g transform="translate(155, 0)">
        <rect width="190" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#c084fc">🌳 Git Worktrees</text>
      </g>

      <!-- Pill 3: Vue 3 Cockpit -->
      <g transform="translate(360, 0)">
        <rect width="160" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#34d399">🖥 Vue Cockpit</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Large 3D Swarm Emblem -->
  <g transform="translate(760, 135)" filter="url(#glow-card)">
    <rect width="320" height="320" rx="72" fill="#090d16" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="3" />

    <!-- Connection Beams -->
    <path d="M 85 90 L 235 90" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />
    <path d="M 235 90 L 85 230" stroke="url(#z-stroke-og)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 85 230 L 235 230" stroke="#10b981" stroke-width="16" stroke-linecap="round" />

    <!-- Secondary dashed lines -->
    <path d="M 100 70 L 220 70" stroke="#c084fc" stroke-width="4" stroke-dasharray="6 6" opacity="0.7" />
    <path d="M 220 105 L 100 215" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 6" opacity="0.7" />

    <!-- Agent Node Spheres -->
    <circle cx="85" cy="90" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
    <circle cx="85" cy="90" r="8" fill="#38bdf8" />

    <circle cx="235" cy="90" r="20" fill="#0f172a" stroke="#c084fc" stroke-width="5" />
    <circle cx="235" cy="90" r="9" fill="#c084fc" />

    <!-- Center Overmind Core -->
    <circle cx="160" cy="160" r="24" fill="#090d16" stroke="url(#brand-grad)" stroke-width="6" />
    <circle cx="160" cy="160" r="10" fill="#ffffff" />

    <circle cx="85" cy="230" r="20" fill="#0f172a" stroke="#8b5cf6" stroke-width="5" />
    <circle cx="85" cy="230" r="9" fill="#8b5cf6" />

    <circle cx="235" cy="230" r="18" fill="#0f172a" stroke="#34d399" stroke-width="5" />
    <circle cx="235" cy="230" r="8" fill="#34d399" />
  </g>
</svg>
