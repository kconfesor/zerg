<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <!-- Square corners throughout, deliberately: every surface in the cockpit is
       rounded-none, and a mark with softer corners than the product it stands
       for reads as somebody else's logo. -->
  <defs>
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="light-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="light-sub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="z-stroke-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="180" fill="url(#light-bg)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Embedded Swarm Emblem (Left Icon) -->
  <g transform="translate(24, 18)">
    <rect width="144" height="144" fill="#0f172a" />

    <!-- Connection Beams -->
    <path d="M 40 44 L 104 44" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M 104 44 L 40 100" stroke="url(#z-stroke-light)" stroke-width="10" stroke-linecap="round" />
    <path d="M 40 100 L 104 100" stroke="#10b981" stroke-width="8" stroke-linecap="round" />

    <!-- Nodes -->
    <circle cx="40" cy="44" r="7" fill="#38bdf8" />
    <circle cx="104" cy="44" r="8" fill="#c084fc" />
    <circle cx="72" cy="72" r="9" fill="#ffffff" stroke="#a855f7" stroke-width="3" />
    <circle cx="40" cy="100" r="8" fill="#8b5cf6" />
    <circle cx="104" cy="100" r="7" fill="#34d399" />
  </g>

  <!-- Typography -->
  <g transform="translate(196, 0)">
    <!-- Logotype: ZERG -->
    <text x="0" y="106" font-family="'JetBrains Mono', 'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-2" fill="url(#light-text)">zerg</text>

    <!-- Glowing Accent Dot on 'g' -->
    <circle cx="212" cy="98" r="7" fill="#7c3aed" />

    <!-- Tagline: MULTI-AGENT ORCHESTRATOR -->
    <text x="4" y="138" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="4" fill="url(#light-sub)">MULTI-AGENT ORCHESTRATOR</text>
  </g>
</svg>
