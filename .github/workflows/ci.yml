name: ci

# The checks that were being run by hand. Several findings in the last review
# were things a machine notices reliably and a person notices sometimes: a data
# race that only appears under load, a Vue type error behind a template, a file
# that stopped being gofmt-clean.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Formatting first: it is the cheapest failure to read.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # Disabled for now, on request. It has already earned its keep — it found
      # a real race between the per-spawn config refresh and the quota poller
      # that `go test` never saw — but it is slow and it is the step that keeps
      # this workflow red while other things are being fixed.
      #
      # Run it by hand before touching anything that supervises a process or
      # routes work:
      #
      #   go test -race ./internal/agent ./internal/event ./internal/cerebrate \
      #                 ./internal/nydus ./internal/overmind
      #
      # - name: race
      #   run: go test -race ./internal/agent ./internal/event ./internal/cerebrate ./internal/nydus ./internal/overmind

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Errors, not style: a promise nobody awaits, a prop mutated in place, a
      # v-for without a key. Types are vue-tsc's job, below.
      - name: lint
        run: pnpm lint

      # vue-tsc checks templates as well as script blocks, which is where the
      # type errors that matter actually live.
      - name: typecheck
        run: pnpm exec vue-tsc --noEmit

      # Unit tests for the parts that are logic rather than layout: the argument
      # round trip, the stale-response guard, the pending-operation guard, and
      # the model combobox's keyboard behaviour.
      - name: test
        run: pnpm test

      - run: pnpm build
